name: Build SlutSearch 1.3.0 unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Unpack SlutSearch 1.3.0 project
        run: |
          python3 - <<'PYCODE'
          import zipfile
          from pathlib import Path
          root = Path.cwd().resolve()
          with zipfile.ZipFile('SlutSearch-1.3.0-project.zip') as z:
              for item in z.infolist():
                  target = (root / item.filename).resolve()
                  if not target.is_relative_to(root):
                      raise RuntimeError('Invalid archive path: ' + item.filename)
              z.extractall(root)
          PYCODE
      - name: Fix Xcode 27 optional URLRequest
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('SlutSearch/Web/BrowserSession.swift')
          s = p.read_text(encoding='utf-8')
          before = 'onWebsiteFileDownloaded?(url, download.originalRequest.url)'
          after = 'onWebsiteFileDownloaded?(url, download.originalRequest?.url)'
          if before in s:
              assert s.count(before) == 1
              p.write_text(s.replace(before, after), encoding='utf-8')
              print('Xcode 27 compatibility fix applied')
          elif after in s:
              print('Fix already present')
          else:
              raise RuntimeError('Download callback not found')
          PYCODE
      - name: Check installed Xcode
        run: xcodebuild -version
      - name: Compile unsigned iOS IPA
        run: bash scripts/build_unsigned_ipa.sh
      - name: Upload compiled IPA
        uses: actions/upload-artifact@v4
        with:
          name: SlutSearch-1.3.0-unsigned-IPA
          path: |
            dist/SlutSearch-iOS-1.3.0-unsigned.ipa
            dist/SlutSearch-iOS-1.3.0-unsigned.ipa.sha256
          if-no-files-found: error
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SlutSearch-1.3.0-build-log
          path: .build/xcodebuild.log
          if-no-files-found: ignore
